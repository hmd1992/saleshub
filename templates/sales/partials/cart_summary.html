{% if cart %}

<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="card-body p-3 p-md-4">

        <!-- الإجمالي -->
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-6">الإجمالي</span>
            <span class="fw-bold fs-5 text-dark">
                ${{ totals.subtotal }}
            </span>
        </div>

        <!-- زر التفاصيل -->
        <div class="mt-3 pt-3 border-top">
            <button
                type="button"
                class="btn btn-sm btn-outline-secondary rounded-3 w-100"
                data-bs-toggle="collapse"
                data-bs-target="#cartFinancialDetails"
                aria-expanded="false"
                aria-controls="cartFinancialDetails"
            >
                تفاصيل
            </button>

            <!-- التفاصيل الداخلية -->
            <div
                class="collapse"
                id="cartFinancialDetails"
            >
                <div class="mt-3 p-3 rounded-3 bg-light">

                    <!-- التكلفة -->
                    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom">
                        <span class="text-muted">
                            التكلفة
                        </span>

                        <span class="text-muted fw-semibold">
                            ${{ totals.total_cost }}
                        </span>
                    </div>

                    <!-- الربح التقديري -->
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">
                            الربح التقديري
                        </span>

                        <span class="
                            fw-bold fs-6
                            {% if totals.total_profit > 0 %}
                                text-success
                            {% elif totals.total_profit < 0 %}
                                text-danger
                            {% else %}
                                text-muted
                            {% endif %}
                        ">
                            ${{ totals.total_profit }}
                        </span>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

{% endif %}
