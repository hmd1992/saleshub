{% extends "base.html" %}

{% block title %}حذف مصروف{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-3 text-danger">حذف مصروف</h1>

        <p class="mb-4">
            هل أنت متأكد من حذف المصروف:
            <strong>{{ object.title }}</strong>
            بقيمة
            <strong>${{ object.amount_usd }}</strong>
            ؟
        </p>

        <form method="post" class="d-flex gap-2">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger px-4">
                نعم، حذف
            </button>

            <a href="{% url 'expenses:list' %}" class="btn btn-outline-secondary px-4">
                إلغاء
            </a>
        </form>
    </div>
</div>
{% endblock %}
